# ComplexForm-AI Hub - Daily SCI Paper Sniffer Pipeline
# =======================================================
# 每日定时执行：OpenAlex/PubMed 检索 -> 去重 -> 规则抽取 -> LLM摘要(可选) -> 入库 -> 导出前端JSON -> commit
#
# 触发方式：
#   1. 定时：每日 UTC 02:00（北京时间 10:00），自动增量检索（最近 7 天）
#   2. 手动：GitHub Actions 页面点击 "Run workflow"
#      - full_scan=true：全网检索（首次部署或补全历史文献时使用）
#      - full_scan=false（默认）：只检索最近 7 天的新文献
#
# 所需 Secrets（Settings -> Secrets and variables -> Actions）：
#   OPENAI_API_KEY   - NVIDIA NIM API Key（nvapi- 开头，可选，缺失则降级为纯规则抽取）
#   OPENAI_API_BASE  - LLM API Base URL（默认 https://integrate.api.nvidia.com/v1）
#   OPENAI_MODEL     - 单模型名（可选，设置后跳过降级链直接用该模型）
#   PUBMED_API_KEY   - PubMed API Key（可选，提高速率限制）
#
# LLM 模型降级链（自动按序测试，选第一个可用的）：
#   1. nvidia/nemotron-3-super-120b-a12b（首选）
#   2. nvidia/nemotron-3-ultra-550b-a55b（次选）
#   3. deepseek-ai/deepseek-v4-flash（保底）
#
# 数据流：
#   每日嗅探更新 data/ 并 commit 后，deploy.yml 监听 data/frontend/** 变更
#   会自动触发重新构建并部署到 GitHub Pages，网站统计数据随之刷新。

name: Daily Paper Sniffer

on:
  schedule:
    # UTC 02:00 daily = Beijing 10:00
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      full_scan:
        description: "Full scan (true=all history, false=last 7 days only)"
        required: false
        default: "false"
      per_query:
        description: "Papers per search query (default 25)"
        required: false
        default: "25"
      skip_llm:
        description: "Skip LLM summarization (true/false)"
        required: false
        default: "false"

permissions:
  contents: write  # Required for git push

concurrency:
  group: sniffer-run
  cancel-in-progress: false

jobs:
  sniff:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # -------------------------------------------------------------------
      # 1. Checkout
      # -------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for proper diff

      # -------------------------------------------------------------------
      # 2. Setup Python
      # -------------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # -------------------------------------------------------------------
      # 3. Install dependencies
      # -------------------------------------------------------------------
      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt

      # -------------------------------------------------------------------
      # 4. Run sniffer
      # -------------------------------------------------------------------
      - name: Run paper sniffer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          PUBMED_API_KEY: ${{ secrets.PUBMED_API_KEY }}
        run: |
          FULL_SCAN="${{ github.event.inputs.full_scan || 'false' }}"
          PER_QUERY="${{ github.event.inputs.per_query || '25' }}"
          SKIP_LLM="${{ github.event.inputs.skip_llm || 'false' }}"

          # full_scan=true -> days=0 (检索全部历史)
          # full_scan=false -> days=7 (只检索最近 7 天)
          if [ "$FULL_SCAN" = "true" ]; then
            DAYS=0
            echo "=== 全网检索模式 (full scan) ==="
          else
            DAYS=7
            echo "=== 增量检索模式 (最近 7 天) ==="
          fi

          ARGS="--per-query $PER_QUERY --days $DAYS"
          if [ "$SKIP_LLM" = "true" ]; then
            ARGS="$ARGS --no-llm"
          fi

          echo "Running sniffer with: $ARGS"
          python src/sniffer.py $ARGS

      # -------------------------------------------------------------------
      # 5. Commit updated data (triggers deploy.yml via data/frontend/** path)
      # -------------------------------------------------------------------
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if there are changes
          if git diff --quiet data/; then
            echo "No changes to commit"
          else
            git add data/
            git commit -m "chore(data): daily sniffer update $(date -u +%Y-%m-%d)"
            git push
            echo "Data committed and pushed - deploy.yml will auto-rebuild GitHub Pages"
          fi
