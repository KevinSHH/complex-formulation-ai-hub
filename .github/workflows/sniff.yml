# ComplexForm-AI Hub - Daily SCI Paper Sniffer Pipeline
# =======================================================
# 每日定时执行：OpenAlex/PubMed 检索 -> 去重 -> 规则抽取 -> LLM摘要(可选) -> 入库 -> 导出前端JSON -> commit
#
# 触发方式：
#   1. 定时：每日 UTC 02:00（北京时间 10:00）
#   2. 手动：GitHub Actions 页面点击 "Run workflow"
#
# 所需 Secrets（Settings -> Secrets and variables -> Actions）：
#   OPENAI_API_KEY   - LLM API Key（可选，缺失则降级为纯规则抽取）
#   OPENAI_API_BASE  - LLM API Base URL（可选，默认 https://api.openai.com/v1）
#                      用 NVIDIA NIM 免费额度则填 https://integrate.api.nvidia.com/v1
#   OPENAI_MODEL     - 模型名（可选，默认 gpt-4o-mini；NVIDIA 如 deepseek-ai/deepseek-v3.1）
#   PUBMED_API_KEY   - PubMed API Key（可选，提高速率限制）
#
# 数据流：
#   每日嗅探更新 data/ 并 commit 后，deploy.yml 监听 data/frontend/** 变更
#   会自动触发重新构建并部署到 GitHub Pages，网站统计数据随之刷新。

name: Daily Paper Sniffer

on:
  schedule:
    # UTC 02:00 daily = Beijing 10:00
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Only fetch papers from last N days (0 = all, default 7)"
        required: false
        default: "7"
      per_query:
        description: "Papers per search query (default 25)"
        required: false
        default: "25"
      skip_llm:
        description: "Skip LLM summarization (true/false)"
        required: false
        default: "false"

permissions:
  contents: write  # Required for git push

concurrency:
  group: sniffer-run
  cancel-in-progress: false

jobs:
  sniff:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # -------------------------------------------------------------------
      # 1. Checkout
      # -------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for proper diff

      # -------------------------------------------------------------------
      # 2. Setup Python
      # -------------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # -------------------------------------------------------------------
      # 3. Install dependencies
      # -------------------------------------------------------------------
      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt

      # -------------------------------------------------------------------
      # 4. Run sniffer
      # -------------------------------------------------------------------
      - name: Run paper sniffer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          PUBMED_API_KEY: ${{ secrets.PUBMED_API_KEY }}
        run: |
          DAYS="${{ github.event.inputs.days || '0' }}"
          PER_QUERY="${{ github.event.inputs.per_query || '25' }}"
          SKIP_LLM="${{ github.event.inputs.skip_llm || 'false' }}"

          ARGS="--per-query $PER_QUERY --days $DAYS"
          if [ "$SKIP_LLM" = "true" ]; then
            ARGS="$ARGS --no-llm"
          fi

          echo "Running sniffer with: $ARGS"
          python src/sniffer.py $ARGS

      # -------------------------------------------------------------------
      # 5. Commit updated data (triggers deploy.yml via data/frontend/** path)
      # -------------------------------------------------------------------
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if there are changes
          if git diff --quiet data/; then
            echo "No changes to commit"
          else
            git add data/
            git commit -m "chore(data): daily sniffer update $(date -u +%Y-%m-%d)"
            git push
            echo "Data committed and pushed - deploy.yml will auto-rebuild GitHub Pages"
          fi
