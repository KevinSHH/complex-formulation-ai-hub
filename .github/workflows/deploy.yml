# ComplexForm-AI Hub - Frontend Build & Deploy to GitHub Pages
# ==============================================================
# 当前端代码或数据变更时构建并部署到 GitHub Pages。
# 使用 gh-pages 分支托管静态文件，完全免费。

name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "data/frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write  # Required for pushing to gh-pages branch

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # -------------------------------------------------------------------
      # 1. Checkout
      # -------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # 2. Setup Node
      # -------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # -------------------------------------------------------------------
      # 3. Install & Build
      # -------------------------------------------------------------------
      - name: Install dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Copy data to dist
        run: |
          mkdir -p frontend/dist/data
          cp data/frontend/papers.json frontend/dist/data/
          cp data/frontend/taxonomy.json frontend/dist/data/
          cp data/frontend/meta.json frontend/dist/data/

      # -------------------------------------------------------------------
      # 4. Add .nojekyll (bypass Jekyll processing for _assets etc.)
      # -------------------------------------------------------------------
      - name: Add .nojekyll
        run: touch frontend/dist/.nojekyll

      # -------------------------------------------------------------------
      # 5. Deploy to GitHub Pages (gh-pages branch)
      # -------------------------------------------------------------------
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
          publish_branch: gh-pages
          force_orphan: true
